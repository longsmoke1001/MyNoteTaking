<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoteTaker - Your Personal Note Manager</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
            flex: 1;
        }

        .sidebar {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            height: fit-content;
        }

        .note-editor {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
        }

        .search-box {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 20px;
            transition: border-color 0.3s ease;
        }

        .search-box:focus {
            outline: none;
            border-color: #667eea;
        }

        .new-note-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 20px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .new-note-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .notes-list {
            max-height: 500px;
            overflow-y: auto;
        }

        .note-item {
            padding: 15px;
            border: 2px solid transparent;
            border-radius: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        .note-item:hover {
            border-color: #667eea;
            transform: translateX(5px);
        }

        .note-item.active {
            border-color: #667eea;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
        }

        .note-title {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 5px;
            color: #333;
        }

        .note-preview {
            font-size: 14px;
            color: #666;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .note-date {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }

        .editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .editor-title {
            font-size: 1.5rem;
            color: #333;
        }

        .editor-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-save {
            background: #28a745;
            color: white;
        }

        .btn-save:hover {
            background: #218838;
            transform: translateY(-1px);
        }

        .btn-delete {
            background: #dc3545;
            color: white;
        }

        .btn-delete:hover {
            background: #c82333;
            transform: translateY(-1px);
        }

        /* Translation */
        .lang-select {
            padding: 8px 10px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            background: white;
            color: #333;
            cursor: pointer;
            max-width: 170px;
            transition: border-color 0.2s ease;
        }

        .lang-select:focus {
            outline: none;
            border-color: #667eea;
        }

        .lang-select:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .btn-translate {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-translate:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.45);
        }

        .btn-translate:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .btn-copy {
            background: #e9ecef;
            color: #333;
        }

        .btn-copy:hover {
            background: #dee2e6;
        }

        .translate-panel {
            margin-top: 25px;
            border: 2px solid rgba(102, 126, 234, 0.35);
            border-radius: 12px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.07) 0%, rgba(118, 75, 162, 0.07) 100%);
            padding: 20px;
        }

        .translate-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 8px;
        }

        .translate-heading {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            color: #333;
        }

        .translate-model {
            font-size: 11px;
            font-weight: 500;
            color: #666;
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(102, 126, 234, 0.3);
            border-radius: 20px;
            padding: 2px 10px;
        }

        .translate-actions {
            display: flex;
            gap: 8px;
        }

        .translate-hint {
            font-size: 12px;
            color: #666;
            font-style: italic;
            margin-bottom: 14px;
        }

        .translate-title {
            font-size: 1.2rem;
            color: #333;
            margin-bottom: 10px;
        }

        .translate-content {
            font-size: 15px;
            line-height: 1.6;
            color: #333;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 420px;
            overflow-y: auto;
        }

        .translate-content:empty {
            display: none;
        }

        .translate-loading {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #666;
            font-size: 14px;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 3px solid rgba(102, 126, 234, 0.25);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-textarea {
            width: 100%;
            min-height: 300px;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.3s ease;
            line-height: 1.6;
        }

        .form-textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .empty-state p {
            font-size: 1rem;
            opacity: 0.8;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #f5c6cb;
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #c3e6cb;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .container {
                padding: 15px;
            }
            
            .sidebar, .note-editor {
                padding: 20px;
            }

            .editor-actions {
                width: 100%;
                justify-content: flex-start;
            }

            .lang-select {
                flex: 1;
                max-width: none;
            }

            .translate-content {
                max-height: 300px;
            }
        }

        /* Custom Scrollbar */
        .notes-list::-webkit-scrollbar {
            width: 6px;
        }

        .notes-list::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 3px;
        }

        .notes-list::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 3px;
        }

        .notes-list::-webkit-scrollbar-thumb:hover {
            background: #5a6fd8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📝 NoteTaker</h1>
            <p>Organize your thoughts, capture your ideas</p>
        </div>

        <div class="main-content">
            <div class="sidebar">
                <input type="text" class="search-box" id="searchBox" placeholder="🔍 Search notes...">
                <button class="new-note-btn" id="newNoteBtn">✨ New Note</button>
                
                <div class="notes-list" id="notesList">
                    <div class="loading">Loading notes...</div>
                </div>
            </div>

            <div class="note-editor">
                <div class="editor-header">
                    <h2 class="editor-title" id="editorTitle">Select a note to edit</h2>
                    <div class="editor-actions" id="editorActions" style="display: none;">
                        <select class="lang-select" id="targetLang" disabled>
                            <option value="">Language...</option>
                        </select>
                        <button class="btn btn-translate" id="translateBtn" disabled>🌐 Translate</button>
                        <button class="btn btn-save" id="saveBtn">💾 Save</button>
                        <button class="btn btn-delete" id="deleteBtn">🗑️ Delete</button>
                    </div>
                </div>

                <div id="messageArea"></div>

                <div id="editorForm" style="display: none;">
                    <div class="form-group">
                        <label class="form-label" for="noteTitle">Title</label>
                        <input type="text" class="form-input" id="noteTitle" placeholder="Enter note title...">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="noteContent">Content</label>
                        <textarea class="form-textarea" id="noteContent" placeholder="Start writing your note..."></textarea>
                    </div>
                </div>

                <div class="translate-panel" id="translatePanel" style="display: none;">
                    <div class="translate-header">
                        <div class="translate-heading">
                            <span>🌐</span>
                            <span id="translateLangLabel">Translation</span>
                            <span class="translate-model" id="translateModel"></span>
                        </div>
                        <div class="translate-actions">
                            <button class="btn btn-copy" id="copyTranslationBtn">📋 Copy</button>
                            <button class="btn" id="closeTranslationBtn">✕ Close</button>
                        </div>
                    </div>
                    <p class="translate-hint">Read-only preview — your original note is unchanged.</p>
                    <h3 class="translate-title" id="translateTitle"></h3>
                    <div class="translate-content" id="translateContent"></div>
                </div>

                <div class="empty-state" id="emptyState">
                    <h3>Welcome to NoteTaker!</h3>
                    <p>Select an existing note or create a new one to get started.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        class NoteTaker {
            constructor() {
                this.notes = [];
                this.currentNote = null;
                this.isLoading = false;
                this.languages = [];
                this.translationConfigured = false;
                this.isTranslating = false;
                this.translateModel = '';
                this.translation = null;
                this.init();
            }

            async init() {
                this.bindEvents();
                await this.loadLanguages();
                await this.loadNotes();
            }

            bindEvents() {
                document.getElementById('newNoteBtn').addEventListener('click', () => this.createNewNote());
                document.getElementById('saveBtn').addEventListener('click', () => this.saveNote());
                document.getElementById('deleteBtn').addEventListener('click', () => this.deleteNote());
                document.getElementById('searchBox').addEventListener('input', (e) => this.searchNotes(e.target.value));

                // Translation
                document.getElementById('translateBtn').addEventListener('click', () => this.translateCurrentNote());
                document.getElementById('closeTranslationBtn').addEventListener('click', () => this.hideTranslation());
                document.getElementById('copyTranslationBtn').addEventListener('click', () => this.copyTranslation());
                document.getElementById('targetLang').addEventListener('change', (e) => {
                    localStorage.setItem('notetaker.targetLang', e.target.value);
                    this.hideTranslation();
                    // Picking a language is what makes the button usable, so the
                    // state has to be recomputed here.
                    this.setTranslationBusy(this.isTranslating);
                });

                // Auto-save on content change (debounced)
                let saveTimeout;
                const autoSave = () => {
                    clearTimeout(saveTimeout);
                    saveTimeout = setTimeout(() => {
                        if (this.currentNote && this.currentNote.id) {
                            this.saveNote(true);
                        }
                    }, 2000);
                };

                document.getElementById('noteTitle').addEventListener('input', autoSave);
                document.getElementById('noteContent').addEventListener('input', autoSave);
            }

            // --- Translation -------------------------------------------------

            async loadLanguages() {
                const select = document.getElementById('targetLang');
                try {
                    const response = await fetch('/api/languages');
                    if (!response.ok) throw new Error('Failed to load languages');

                    const data = await response.json();
                    this.languages = data.languages || [];
                    this.translationConfigured = !!data.configured;
                    this.translateModel = data.model || '';

                    select.innerHTML = '<option value="">Translate to...</option>' + this.languages
                        .map(lang => `<option value="${lang.code}">${this.escapeHtml(lang.name)}</option>`)
                        .join('');

                    const saved = localStorage.getItem('notetaker.targetLang');
                    const stillValid = this.languages.some(lang => lang.code === saved);
                    select.value = stillValid ? saved : '';

                    // Set the disabled state here too: if AI_API_KEY is missing
                    // the controls must be locked, otherwise the button needs
                    // its initial state derived rather than left as markup.
                    this.translationConfigured
                        ? (select.title = '')
                        : (select.title = 'Add AI_API_KEY to your .env file to enable translation');
                    this.setTranslationBusy(this.isTranslating);
                } catch (error) {
                    select.innerHTML = '<option value="">Unavailable</option>';
                    select.disabled = true;
                    this.translationConfigured = false;
                    this.setTranslationBusy(this.isTranslating);
                }
            }

            languageName(code) {
                const match = this.languages.find(lang => lang.code === code);
                return match ? match.name : code;
            }

            setTranslationBusy(isBusy) {
                this.isTranslating = isBusy;
                const button = document.getElementById('translateBtn');
                const select = document.getElementById('targetLang');

                // The button stays clickable once a note is open, even with no
                // language chosen yet: clicking it explains what is missing
                // instead of leaving a dead control on screen.
                const hasNote = !!this.currentNote;
                button.disabled = isBusy || !hasNote || !this.translationConfigured;
                button.textContent = isBusy ? '⏳ Translating...' : '🌐 Translate';
                select.disabled = isBusy || !this.translationConfigured;

                if (isBusy) {
                    button.title = 'Translating...';
                } else if (!this.translationConfigured) {
                    button.title = 'Add AI_API_KEY to your .env file to enable translation';
                } else if (!hasNote) {
                    button.title = 'Open a note to translate';
                } else if (!select.value) {
                    button.title = 'Choose a language first';
                } else {
                    button.title = `Translate this note into ${this.languageName(select.value)}`;
                }
            }

            async translateCurrentNote() {
                if (this.isTranslating || !this.currentNote) return;

                const select = document.getElementById('targetLang');
                const targetLang = select.value;
                if (!targetLang) {
                    this.showMessage('Please choose a language first', 'error');
                    return;
                }

                // Translate the text currently in the editor so unsaved edits are
                // included, but never write the result back into these inputs.
                const title = document.getElementById('noteTitle').value.trim();
                const content = document.getElementById('noteContent').value.trim();

                if (!title && !content) {
                    this.showMessage('Nothing to translate yet', 'error');
                    return;
                }

                this.setTranslationBusy(true);
                this.showTranslationLoading(this.languageName(targetLang));
                this.hideMessage();

                try {
                    // Title and body go out in a single request: it is faster and
                    // a rate limited model only has to answer once.
                    const response = await fetch('/api/translate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            title: title || undefined,
                            text: content,
                            target_lang: targetLang
                        })
                    });

                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error || 'Translation failed');

                    this.translation = {
                        noteId: this.currentNote.id,
                        targetLang,
                        title: data.translated_title || '',
                        content: data.translated_text
                    };
                    this.renderTranslation();
                } catch (error) {
                    this.hideTranslation();
                    this.showMessage(`Translation failed: ${error.message}`, 'error');
                } finally {
                    this.setTranslationBusy(false);
                }
            }

            showTranslationLoading(languageName) {
                const panel = document.getElementById('translatePanel');
                document.getElementById('translateLangLabel').textContent = `${languageName} translation`;
                document.getElementById('translateModel').textContent = this.translateModel || '';
                document.getElementById('translateTitle').textContent = '';
                document.getElementById('translateContent').innerHTML =
                    '<div class="translate-loading"><span class="spinner"></span> Translating, this can take a few seconds...</div>';
                panel.style.display = 'block';
                panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }

            renderTranslation() {
                if (!this.translation) return;
                const { targetLang, title, content } = this.translation;

                document.getElementById('translateLangLabel').textContent = `${this.languageName(targetLang)} translation`;
                document.getElementById('translateModel').textContent = this.translateModel || '';
                document.getElementById('translateTitle').textContent = title;
                // textContent keeps the model output as plain text, no HTML parsing.
                document.getElementById('translateContent').textContent = content || '';
                document.getElementById('translatePanel').style.display = 'block';
            }

            hideTranslation() {
                this.translation = null;
                document.getElementById('translatePanel').style.display = 'none';
            }

            async copyTranslation() {
                if (!this.translation) return;
                const text = [this.translation.title, this.translation.content]
                    .filter(Boolean)
                    .join('\n\n');

                try {
                    await navigator.clipboard.writeText(text);
                    this.showMessage('Translation copied to clipboard', 'success');
                } catch (error) {
                    this.showMessage('Could not copy to your clipboard', 'error');
                }
            }

            // --- Notes ------------------------------------------------------

            async loadNotes() {
                this.isLoading = true;
                this.showMessage('Loading notes...', 'loading');
                
                try {
                    const response = await fetch('/api/notes');
                    if (!response.ok) throw new Error('Failed to load notes');
                    
                    this.notes = await response.json();
                    this.renderNotesList();
                    this.hideMessage();
                } catch (error) {
                    this.showMessage(`Error loading notes: ${error.message}`, 'error');
                } finally {
                    this.isLoading = false;
                }
            }

            renderNotesList() {
                const notesList = document.getElementById('notesList');
                
                if (this.notes.length === 0) {
                    notesList.innerHTML = '<div class="empty-state"><p>No notes yet. Create your first note!</p></div>';
                    return;
                }

                notesList.innerHTML = this.notes.map(note => `
                    <div class="note-item ${this.currentNote && this.currentNote.id === note.id ? 'active' : ''}" 
                         data-note-id="${note.id}" onclick="noteTaker.selectNote(${note.id})">
                        <div class="note-title">${this.escapeHtml(note.title || 'Untitled')}</div>
                        <div class="note-preview">${this.escapeHtml(note.content || 'No content')}</div>
                        <div class="note-date">${this.formatDate(note.updated_at)}</div>
                    </div>
                `).join('');
            }

            async selectNote(noteId) {
                const note = this.notes.find(n => n.id === noteId);
                if (!note) return;

                this.currentNote = note;
                this.hideTranslation();
                this.showEditor();
                this.renderNotesList(); // Re-render to update active state
                
                document.getElementById('noteTitle').value = note.title || '';
                document.getElementById('noteContent').value = note.content || '';
                document.getElementById('editorTitle').textContent = note.title || 'Untitled Note';
            }

            createNewNote() {
                this.currentNote = {
                    id: null,
                    title: '',
                    content: '',
                    created_at: new Date().toISOString(),
                    updated_at: new Date().toISOString()
                };
                
                this.hideTranslation();
                this.showEditor();
                document.getElementById('noteTitle').value = '';
                document.getElementById('noteContent').value = '';
                document.getElementById('editorTitle').textContent = 'New Note';
                document.getElementById('noteTitle').focus();
                
                // Remove active state from all notes
                document.querySelectorAll('.note-item').forEach(item => {
                    item.classList.remove('active');
                });
            }

            showEditor() {
                document.getElementById('emptyState').style.display = 'none';
                document.getElementById('editorForm').style.display = 'block';
                document.getElementById('editorActions').style.display = 'flex';
                this.setTranslationBusy(this.isTranslating);
            }

            hideEditor() {
                document.getElementById('emptyState').style.display = 'block';
                document.getElementById('editorForm').style.display = 'none';
                document.getElementById('editorActions').style.display = 'none';
                document.getElementById('editorTitle').textContent = 'Select a note to edit';
                this.hideTranslation();
                this.currentNote = null;
                this.setTranslationBusy(false);
            }

            async saveNote(isAutoSave = false) {
                if (!this.currentNote) return;

                const title = document.getElementById('noteTitle').value.trim();
                const content = document.getElementById('noteContent').value.trim();

                if (!title && !content) {
                    if (!isAutoSave) {
                        this.showMessage('Please enter a title or content', 'error');
                    }
                    return;
                }

                try {
                    const noteData = {
                        title: title || 'Untitled',
                        content: content
                    };

                    let response;
                    if (this.currentNote.id) {
                        // Update existing note
                        response = await fetch(`/api/notes/${this.currentNote.id}`, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(noteData)
                        });
                    } else {
                        // Create new note
                        response = await fetch('/api/notes', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(noteData)
                        });
                    }

                    if (!response.ok) throw new Error('Failed to save note');

                    const savedNote = await response.json();
                    this.currentNote = savedNote;
                    
                    // Update notes list
                    const existingIndex = this.notes.findIndex(n => n.id === savedNote.id);
                    if (existingIndex >= 0) {
                        this.notes[existingIndex] = savedNote;
                    } else {
                        this.notes.unshift(savedNote);
                    }
                    
                    this.renderNotesList();
                    document.getElementById('editorTitle').textContent = savedNote.title;
                    
                    if (!isAutoSave) {
                        this.showMessage('Note saved successfully!', 'success');
                    }
                } catch (error) {
                    this.showMessage(`Error saving note: ${error.message}`, 'error');
                }
            }

            async deleteNote() {
                if (!this.currentNote || !this.currentNote.id) return;

                if (!confirm('Are you sure you want to delete this note?')) return;

                try {
                    const response = await fetch(`/api/notes/${this.currentNote.id}`, {
                        method: 'DELETE'
                    });

                    if (!response.ok) throw new Error('Failed to delete note');

                    // Remove from notes array
                    this.notes = this.notes.filter(n => n.id !== this.currentNote.id);
                    this.renderNotesList();
                    this.hideEditor();
                    this.showMessage('Note deleted successfully!', 'success');
                } catch (error) {
                    this.showMessage(`Error deleting note: ${error.message}`, 'error');
                }
            }

            searchNotes(query) {
                const filteredNotes = query.trim() === '' ? this.notes : 
                    this.notes.filter(note => 
                        (note.title && note.title.toLowerCase().includes(query.toLowerCase())) ||
                        (note.content && note.content.toLowerCase().includes(query.toLowerCase()))
                    );

                const notesList = document.getElementById('notesList');
                if (filteredNotes.length === 0) {
                    notesList.innerHTML = '<div class="empty-state"><p>No notes found matching your search.</p></div>';
                    return;
                }

                notesList.innerHTML = filteredNotes.map(note => `
                    <div class="note-item ${this.currentNote && this.currentNote.id === note.id ? 'active' : ''}" 
                         data-note-id="${note.id}" onclick="noteTaker.selectNote(${note.id})">
                        <div class="note-title">${this.escapeHtml(note.title || 'Untitled')}</div>
                        <div class="note-preview">${this.escapeHtml(note.content || 'No content')}</div>
                        <div class="note-date">${this.formatDate(note.updated_at)}</div>
                    </div>
                `).join('');
            }

            showMessage(message, type) {
                const messageArea = document.getElementById('messageArea');
                messageArea.innerHTML = `<div class="${type}">${message}</div>`;
                
                if (type === 'success') {
                    setTimeout(() => this.hideMessage(), 3000);
                }
            }

            hideMessage() {
                document.getElementById('messageArea').innerHTML = '';
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            formatDate(dateString) {
                const date = new Date(dateString);
                const now = new Date();
                const diffTime = Math.abs(now - date);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                if (diffDays === 1) {
                    return 'Today';
                } else if (diffDays === 2) {
                    return 'Yesterday';
                } else if (diffDays <= 7) {
                    return `${diffDays - 1} days ago`;
                } else {
                    return date.toLocaleDateString();
                }
            }
        }

        // Initialize the app
        const noteTaker = new NoteTaker();
    </script>
</body>
</html>
